# ─────────────────────────────────────────────────────────────────────────────
# dashboard.yml — Publica o dashboard no GitHub Pages
#
# O que este workflow faz:
#   1. É disparado manualmente (workflow_dispatch) ou quando o arquivo
#      dashboard/dashboard.html é atualizado na branch main
#   2. Publica o conteúdo da pasta dashboard/ no GitHub Pages
#
# Pré-requisito:
#   Ative o GitHub Pages em Settings > Pages > Source: GitHub Actions
#
# Como usar:
#   Após o pipeline gerar um novo dashboard.html localmente:
#     git add dashboard/dashboard.html
#     git commit -m "chore: atualiza dashboard"
#     git push
#   O workflow publica automaticamente.
#
#   Ou dispare manualmente em Actions > dashboard > Run workflow.
# ─────────────────────────────────────────────────────────────────────────────

name: Publicar dashboard no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboard/dashboard.html"   # só dispara quando o dashboard mudar
  workflow_dispatch:                 # disparo manual pela interface do GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:

  deploy:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer upload da pasta dashboard/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4