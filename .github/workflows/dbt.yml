name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hub_vagas
          POSTGRES_PASSWORD: hub_vagas
          POSTGRES_DB: hub_vagas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hub_vagas -d hub_vagas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dbt-postgres

      - name: Install pip-tools and verify lock
        run: |
          pip install pip-tools
          piptools compile requirements.in --output-file /tmp/requirements.locked.txt --no-emit-options --quiet
          diff requirements.txt /tmp/requirements.locked.txt && echo "Lock sincronizado" || { echo "ERRO: requirements.txt esta defasado."; exit 1; }

      - name: Create dbt profiles.yml
        run: |
          mkdir -p dbt
          cat > dbt/profiles.yml <<EOF
          hub_vagas:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: hub_vagas
                password: hub_vagas
                dbname: hub_vagas
                schema: public
                threads: 4
          EOF

      - name: Run dbt debug
        working-directory: ./dbt
        run: |
          dbt debug --profiles-dir .

      - name: Run dbt deps
        working-directory: ./dbt
        run: |
          dbt deps --profiles-dir .

      - name: Run dbt build
        working-directory: ./dbt
        run: |
          dbt build --profiles-dir .

      - name: Run dbt test
        working-directory: ./dbt
        run: |
          dbt test --profiles-dir .