name: CI Hub Vagas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Executa dbt build com PostgreSQL toda segunda-feira às 02:00 UTC
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  # ── Job 1: Validação de dependências e lockfile ────────────────────────
  deps:
    name: Validacao de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar pip-tools
        run: pip install pip-tools

      - name: Verificar lockfile requirements.txt
        run: |
          python -m piptools compile requirements.in --output-file /tmp/requirements.locked.txt --no-emit-options --quiet
          diff requirements.txt /tmp/requirements.locked.txt && echo "Lock requirements.txt sincronizado" || { echo "ERRO: requirements.txt esta defasado. Rode 'pip-compile requirements.in' e commit o resultado."; exit 1; }

      - name: Verificar lockfile requirements-dev.txt
        run: |
          python -m piptools compile requirements-dev.in --output-file /tmp/requirements-dev.locked.txt --no-emit-options --quiet
          diff requirements-dev.txt /tmp/requirements-dev.locked.txt && echo "Lock requirements-dev.txt sincronizado" || { echo "ERRO: requirements-dev.txt esta defasado. Rode 'pip-compile requirements-dev.in' e commit o resultado."; exit 1; }

  # ── Job 2: Lint com ruff ─────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar ruff
        run: pip install ruff

      - name: Rodar ruff check
        run: ruff check app/

  # ── Job 3: Testes unitarios (sem banco, rápido) ──────────────────────
  test:
    name: Testes unitarios
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de producao e desenvolvimento
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes unitarios
        run: pytest tests/ -m "not integration" -q --tb=short
        working-directory: ./app

  # ── Job 4: Testes de integracao com PostgreSQL ───────────────────────
  integration:
    name: Testes de integracao (PostgreSQL)
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hub_vagas
          POSTGRES_PASSWORD: hub_vagas
          POSTGRES_DB: hub_vagas
        options: >-
          --health-cmd "pg_isready -U hub_vagas -d hub_vagas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de producao e desenvolvimento
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Criar .env para integracao
        run: |
          cat > app/.env <<'EOF'
          DATABASE_URL=postgresql+psycopg://hub_vagas:hub_vagas@localhost:5432/hub_vagas
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=hub_vagas
          DB_USER=hub_vagas
          DB_PASS=hub_vagas
          DB_SSLMODE=disable
          EOF

      - name: Rodar testes de integracao
        run: pytest tests/ -m integration -q --tb=short
        working-directory: ./app
        env:
          DATABASE_URL: postgresql+psycopg://hub_vagas:hub_vagas@localhost:5432/hub_vagas

  # ── Job 5: dbt build com PostgreSQL ──────────────────────────────────
  dbt-build:
    name: dbt build (PostgreSQL)
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hub_vagas
          POSTGRES_PASSWORD: hub_vagas
          POSTGRES_DB: hub_vagas
        options: >-
          --health-cmd "pg_isready -U hub_vagas -d hub_vagas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de producao e desenvolvimento
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Instalar dbt e adaptador Postgres
        run: pip install dbt-core dbt-postgres

      - name: Criar profiles.yml e .env para dbt
        run: |
          cat > dbt/profiles.yml <<'EOF'
          hub_vagas:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: hub_vagas
                password: hub_vagas
                dbname: hub_vagas
                schema: public
                threads: 4
          EOF
          cat > app/.env <<'EOF'
          DATABASE_URL=postgresql+psycopg://hub_vagas:hub_vagas@localhost:5432/hub_vagas
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=hub_vagas
          DB_USER=hub_vagas
          DB_PASS=hub_vagas
          DB_SSLMODE=disable
          EOF

      - name: Executar migrations antes do dbt
        run: python infra/migrate.py
        working-directory: ./

      - name: Rodar dbt build
        run: python app/transform.py
        working-directory: ./
        env:
          DATABASE_URL: postgresql+psycopg://hub_vagas:hub_vagas@localhost:5432/hub_vagas

  # ── Job 6: Seguranca (detecao de secrets com baseline) ─────────────────
  security:
    name: Seguranca (detecao de secrets)
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar detect-secrets
        run: pip install detect-secrets

      - name: Escanear secrets no repositorio com baseline
        run: |
          python -m detect_secrets scan --baseline .secrets.baseline || { echo "ERRO: Novos secrets detectados. Revise e atualize o baseline se forem falsos positivos."; exit 1; }

  # ── Job 7: Scanner de vulnerabilidades (pip-audit) ─────────────────────
  pip-audit:
    name: Scanner de vulnerabilidades (pip-audit)
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias e pip-audit
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Auditar vulnerabilidades nas dependencias
        run: |
          pip-audit --requirement requirements.txt || { echo "ERRO: Vulnerabilidades encontradas em requirements.txt."; exit 1; }
          pip-audit --requirement requirements-dev.txt || { echo "ERRO: Vulnerabilidades encontradas em requirements-dev.txt."; exit 1; }
