# ─────────────────────────────────────────────────────────────────────────────
# deploy.yml — CI/CD do Hub Vagas para o Render
#
# O que este workflow faz:
#   1. Roda os testes unitários (95 testes)
#   2. Se passar, aciona o Deploy Hook do Render via HTTP POST
#      O Render então puxa o código do GitHub e faz o build automaticamente
#
# Quando dispara:
#   - Push na branch main → testa + deploy
#   - Pull Request na branch main → só testa, sem deploy
#
# Secrets necessários (Settings > Secrets > Actions):
#   RENDER_DEPLOY_HOOK_URL → URL gerada no painel do Render
#                            (Render > seu serviço > Settings > Deploy Hook)
# ─────────────────────────────────────────────────────────────────────────────

name: CI/CD — Hub Vagas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ── Job 1: Testes ─────────────────────────────────────────────────────────
  test:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest tests/ -v --tb=short

  # ── Job 2: Deploy no Render (apenas na main) ──────────────────────────────
  deploy:
    name: Deploy no Render
    runs-on: ubuntu-latest
    needs: test                          # só roda se os testes passarem
    if: github.ref == 'refs/heads/main'  # só na branch main

    steps:
      - name: Acionar redeploy via Deploy Hook
        # O Render detecta o Dockerfile automaticamente e faz o build.
        # Não é necessário buildar a imagem aqui — o Render cuida disso.
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Confirmar disparo do deploy
        run: echo "Deploy acionado no Render com sucesso."