version: 2

models:
  - name: mart_vagas
    description: "Vagas Silver enriquecidas com tecnologias, prontas para exportação."
    columns:
      - name: id
        tests: [not_null, unique]
      - name: link
        tests: [not_null]
      - name: origem
        tests: [not_null]
      - name: descricao_truncada
  - name: mart_salarios
    description: "Cobertura salarial por origem e senioridade: total, n_com_salario, percentual, média e mediana."
    columns:
      - name: origem
        tests: [not_null]
      - name: senioridade
        tests: [not_null]
      - name: total_vagas
        tests: [not_null]
      - name: n_com_salario
        tests: [not_null]
      - name: pct_com_salario
        tests: [not_null]
      - name: salario_min_medio
      - name: salario_max_medio
      - name: salario_min_mediana
      - name: salario_max_mediana
  - name: mart_vagas_por_dia
    description: "Volume de observações coletadas por dia e portal (lê da Silver)."
    columns:
      - name: data_coleta
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: observacoes
        tests: [not_null]
      - name: vagas_distintas
        tests: [not_null]
      - name: vagas_canonicas
        tests: [not_null]
      - name: pct_com_descricao_completa
        tests: [not_null]
  - name: mart_vagas_por_origem_localidade
    description: "Snapshot Silver de vagas por portal, localidade e senioridade."
    columns:
      - name: origem
        tests: [not_null]
      - name: vagas_no_snapshot
        tests: [not_null]
  - name: mart_demanda_tecnologias
    description: "Contagem de vagas Silver que mencionam cada tecnologia monitorada."
    columns:
      - name: tecnologia
        tests: [not_null, unique]
      - name: vagas_com_mencao
        tests: [not_null]
  - name: mart_status_fontes
    description: "Estado da execução mais recente de cada scraper."
    columns:
      - name: origem
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              values: ["success", "empty", "partial", "failed"]
  - name: mart_qualidade_campos
    description: "Saúde do parser por fonte, dia e campo: percentual de não-nulo."
    columns:
      - name: fonte
        tests: [not_null]
      - name: data_coleta
        tests: [not_null]
      - name: campo
        tests: [not_null]
      - name: total_vagas
        tests: [not_null]
      - name: vagas_nao_nulas
        tests: [not_null]
      - name: pct_nao_nulo
        tests: [not_null]
