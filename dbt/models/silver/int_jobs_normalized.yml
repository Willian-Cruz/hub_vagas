version: 2

models:
  - name: int_jobs_normalized
    description: "Silver etapa 2/3: normalização de campos (senioridade, localização, salário, modalidade)."
    columns:
      - name: raw_job_id
        tests: [not_null, unique]
      - name: link
        tests: [not_null]
      - name: data_coleta
        tests: [not_null]
      - name: titulo
        tests: [not_null]
      - name: is_relevant
        tests: [not_null]
      - name: descricao_truncada
        tests: [not_null]
      - name: senioridade
        tests:
          - accepted_values:
              arguments:
                values: ["Estágio/Trainee", "Júnior", "Pleno", "Sênior", "Especialista", "Coordenador", "Liderança", "Diretoria", "Técnico"]
      - name: salario_texto
      - name: salario_min
      - name: salario_max
      - name: salario_tipo
        tests:
          - accepted_values:
              arguments:
                values: ["faixa", "exato", "a_combinar", "nao_informado"]
      - name: data_publicacao
      - name: data_atualizacao
