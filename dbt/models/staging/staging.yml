version: 2

models:
  - name: stg_vagas_com_jobs
    description: "Campos extraídos da raw jobs do Vagas.com."
    columns:
      - name: raw_job_id
        tests: [not_null, unique]
      - name: origem
        tests:
          - not_null
          - accepted_values:
              values: ["Vagas.com"]
      - name: link
        tests: [not_null]
      - name: titulo
        tests: [not_null]
      - name: is_relevant
        tests: [not_null]
  - name: stg_infojobs_jobs
    description: "Campos extraídos da raw job_observations do InfoJobs."
    columns:
      - name: raw_job_id
        tests: [not_null, unique]
      - name: origem
        tests:
          - not_null
          - accepted_values:
              values: ["InfoJobs"]
      - name: link
        tests: [not_null]
      - name: titulo
        tests: [not_null]
      - name: is_relevant
        tests: [not_null]
  - name: stg_gupy_jobs
    description: "Campos extraídos da raw job_observations da Gupy."
    columns:
      - name: raw_job_id
        tests: [not_null, unique]
      - name: origem
        tests:
          - not_null
          - accepted_values:
              values: ["Gupy"]
      - name: link
        tests: [not_null]
      - name: titulo
        tests: [not_null]
      - name: is_relevant
        tests: [not_null]
  - name: stg_catho_jobs
    description: "Campos extraídos da raw job_observations da Catho."
    columns:
      - name: raw_job_id
        tests: [not_null, unique]
      - name: origem
        tests:
          - not_null
          - accepted_values:
              values: ["Catho"]
      - name: link
        tests: [not_null]
      - name: titulo
        tests: [not_null]
      - name: is_relevant
        tests: [not_null]