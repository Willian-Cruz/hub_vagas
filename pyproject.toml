[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hub_vagas"
version = "1.0.0"
description = "Pipeline de dados que coleta vagas de Dados e Tecnologia em portais brasileiros"
requires-python = "==3.11.*"
# Dependências de produção são declaradas em requirements.in e travadas em
# requirements.txt via pip-compile. Este campo fica vazio intencionalmente para
# evitar ter duas fontes de verdade de versões.
dependencies = []

[project.scripts]
hub-vagas-ingest = "app.main:main"
hub-vagas-transform = "app.transform:main"
hub-vagas-scheduler = "app.scheduler:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "PLC", "PD", "PERF", "TRY", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
markers = [
    "integration: testes que exigem PostgreSQL (não rodam em CI sem services: postgres)",
]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
